public_sector:
  name: 공공·국방
  description: 중앙정부·지자체·국방·공기업. 공공 조달법·예산 회계·감사 추적·망분리 환경 핵심.
  korean_examples: 중앙정부, 지자체, 공기업, 방산 협력사
  modules:
    FI: { importance: critical, agent: sap-fi-consultant, note: "정부회계·예산 (FM Funds Management), PSCD" }
