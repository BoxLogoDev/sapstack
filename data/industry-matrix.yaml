    CO: { importance: medium, agent: sap-co-consultant }
    SD: { importance: none }
    PP: { importance: none }
    QM: { importance: none }
    WM: { importance: none }
    EWM: { importance: none }
    TR: { importance: low, agent: sap-tr-consultant }
    BTP: { importance: low, agent: sap-integration-advisor, note: "망분리로 SAP 클라우드 사용 제한" }
    GTS: { importance: none }

# GTS 라우팅 근거 (전용 sap-gts-consultant 없음, 2026-08-16):
#   - agents/*.md 20개 중 GTS 전용 없음. plugins/sap-gts 는 지식 플러그인만.
#   - scripts/eval/run.mjs MODULE_AGENT 에도 GTS 키 없음 (스키마 모듈 enum 밖).
#   - 최근접 도메인은 sap-sd-consultant: symptom-index 의 GTS 인접 증상
#     (sym-kr-unipass-reject, sym-kr-strategic-material) likely_modules[0] = SD,
#     조회 면은 VF01 빌링. WM→EWM 과 같은 "인접 도메인 폴백".
#   - sap-integration-advisor 는 UNI-PASS 행이 있지만 BTP 폴백으로 이미 쓰이므로
#     GTS 까지 겹치면 list_agents_for_industry 가 두 모듈을 한 에이전트로 뭉갠다.
#   - 한계: retail "직구/수입"·financial_services "해외 송금 규제"는 SD 가 약함.
#     인터페이스 장애는 운영자가 sap-integration-advisor 로 재위임해야 함.
