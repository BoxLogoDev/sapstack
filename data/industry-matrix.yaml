    EWM: { importance: critical, agent: sap-ewm-consultant, note: "Batch 관리·유통기한 FEFO" }
    WM: { importance: high, agent: sap-ewm-consultant, note: "ECC 레거시 창고 + FEFO" }
    GTS: { importance: high, agent: sap-sd-consultant, note: "전구체·이중용도 수출 통제·원산지" }
