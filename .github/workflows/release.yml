name: sapstack Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  desktop-windows:
    name: Desktop installer (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # electron 의 tsc 는 packages/runtime/src 까지 들어간다. runtime 소스의
      # import 는 packages/runtime/node_modules 에서 해석되므로 함께 설치한다.
      - name: Install runtime dependencies
        working-directory: packages/runtime
        run: npm ci --workspaces=false

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: bun install --frozen-lockfile --ignore-scripts

      # --ignore-scripts 는 네이티브 바이너리를 받아오는 postinstall 까지 건너뛴다.
      # build-win.ps1 이 ripgrep 바이너리를 설치파일에 복사하므로, 없으면
      # "ERROR: @vscode/ripgrep not installed or postinstall did not run" 로 빌드가 멈춘다.
      # electron 도 같은 이유로 필요하다(electron-log 가 로드 시점에 require 한다).
      - name: Run trusted postinstalls skipped by --ignore-scripts
        working-directory: apps/desktop
        shell: bash
        run: |
          set -e
          # bun pm trust 가 먹지 않는 경우(이미 trusted 목록에 있어 no-op 등)를 대비해
          # 바이너리 존재를 확인하고, 없으면 패키지의 postinstall 을 직접 돌린다.
          bun pm trust @vscode/ripgrep || true
          if [ ! -f node_modules/@vscode/ripgrep/bin/rg.exe ]; then
            echo "ripgrep binary still missing — running postinstall directly"
            node node_modules/@vscode/ripgrep/lib/postinstall.js
          fi
          test -f node_modules/@vscode/ripgrep/bin/rg.exe
          node node_modules/electron/install.js

      # build-win.ps1 이 Windows 빌드 전체를 담당한다: bun 바이너리 다운로드(SHA 검증) →
      # 루트 node_modules 에서 SDK 복사 + claude-agent-sdk-binary alias 생성 →
      # ripgrep/interceptor 복사 → electron 빌드 → electron-builder --win → 설치파일 검증.
      # electron-builder 를 직접 호출하면 alias 가 없어 extraResources 복사가 깨진다
      # (electron-builder.yml 118행 주석 참조).
      - name: Build Windows installer
        working-directory: apps/desktop/apps/electron
        run: powershell -ExecutionPolicy Bypass -File scripts/build-win.ps1
        env:
          # 코드 서명 인증서가 secret 으로 설정돼 있으면 electron-builder 가 자동 서명한다.
          # 없으면 서명 없이 빌드되고 설치 시 SmartScreen 경고가 뜬다.
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          # latest.yml 은 electron-updater 가 새 버전을 판별하는 매니페스트다.
          # Release 에 함께 올라가지 않으면 자동 업데이트가 동작하지 않는다.
          path: |
            apps/desktop/apps/electron/release/*.exe
            apps/desktop/apps/electron/release/latest*.yml
          if-no-files-found: error

  release:
    name: Build & Release
    needs: [desktop-windows]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Enforce public beta diagnostic quality baseline
        run: node scripts/eval/check-gate.mjs docs/eval/latest.json

      - name: Verify tag matches package versions
        run: |
          chmod +x scripts/bump-version.sh
          bash scripts/bump-version.sh --check
          PKG_VERSION=$(sed -nE 's/.*"version"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/p' package.json | head -1)
          if [ "$PKG_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "❌ Tag (${{ steps.version.outputs.version }}) does not match package.json ($PKG_VERSION)"
            echo "    Run: bash scripts/bump-version.sh ${{ steps.version.outputs.version }} && commit before tagging"
            exit 1
          fi
          echo "✅ Tag and package.json both at $PKG_VERSION"

      # 루트에 lockfile 이 없어서 --workspaces=false 가 필요하고,
      # mcp 빌드는 packages/runtime/src 까지 컴파일하므로 그쪽 의존성도 있어야 한다
      - name: Install runtime dependencies
        run: cd packages/runtime && npm ci --workspaces=false

      - name: Install MCP dependencies
        run: cd mcp && npm ci --workspaces=false

      - name: Build MCP package
        run: cd mcp && npm run build

      - name: Run MCP tests
        run: cd mcp && npm test

      - name: Run MCP clean-install smoke test
        run: cd mcp && npm run test:pack --workspaces=false

      - name: Pack MCP tarball
        # mcp/boxlogodev-sapstack-mcp-<version>.tgz 를 working dir 에 생성
        # → 이후 'Create GitHub Release' step 의 files: mcp/*.tgz 패턴이 매치
        # publish 가 NPM_TOKEN 미설정으로 fail 해도 tarball 은 보존됨
        run: cd mcp && npm pack

      - name: Install VS Code Extension dependencies
        run: cd extension && npm ci --workspaces=false

      - name: Build VS Code Extension
        run: cd extension && npm run compile && npm run package

      - name: Generate release notes
        id: notes
        run: |
          bash scripts/generate-release-notes.sh "${{ steps.version.outputs.version }}" > RELEASE_NOTES.md
          echo "notes_file=RELEASE_NOTES.md" >> $GITHUB_OUTPUT

      - name: Download desktop installer
        uses: actions/download-artifact@v4
        with:
          name: desktop-windows
          path: desktop-dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "${{ github.ref_name }} — sapstack"
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: |
            mcp/*.tgz
            extension/*.vsix
            desktop-dist/*.exe
            desktop-dist/latest*.yml

      # 이 스텝은 의도적으로 'Create GitHub Release' 뒤에 있다.
      # npm 은 우리가 통제하지 못하는 외부 의존이고(토큰 만료·2FA·레지스트리 장애),
      # 앞에 두면 그 실패 하나가 데스크톱 설치파일과 latest.yml 배포까지 막는다.
      # 실제로 v2.4.1 이 토큰 만료(E404)로 여기서 세 번째로 멈췄다.
      #
      # continue-on-error 는 쓰지 않는다 — 그러면 run 이 초록으로 보고돼 미발행을 놓친다.
      # 마지막에 두면 릴리스는 나가고 실패는 빨간불로 남는다.
      # 발행 여부의 ground truth 는 항상 `npm view @boxlogodev/sapstack-mcp version`.
      - name: Publish MCP to npm
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN is not configured; publish skipped after successful build, test, and pack."
          else
            cd mcp && npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
