name: sapstack CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  content-gates:
    name: Content Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Lint SKILL.md / agent frontmatter
        run: ./scripts/lint-frontmatter.sh

      - name: Check marketplace.json integrity
        run: ./scripts/check-marketplace.sh

      - name: Check hardcoding (strict)
        run: ./scripts/check-hardcoding.sh --strict

      - name: Check T-code registry (strict)
        run: ./scripts/check-tcodes.sh --strict

      - name: Check Korean references (strict)
        run: ./scripts/check-ko-references.sh --strict

      - name: Check internal markdown links (strict)
        run: ./scripts/check-links.sh --strict

      - name: Check ECC vs S/4HANA split (strict)
        run: ./scripts/check-ecc-s4-split.sh --strict

      - name: Build multi-AI compatibility layer (check-only)
        run: ./scripts/build-multi-ai.sh --check

      - name: Check IMG references
        run: ./scripts/check-img-references.sh

      - name: Check Best Practice structure
        run: ./scripts/check-best-practices.sh

      - name: Check Industry references
        run: ./scripts/check-industry-refs.sh

      - name: Validate config schema
        run: ./scripts/validate-config.sh || true

      - name: Smoke test — resolve-note
        run: |
          ./scripts/resolve-note.sh korea | head -5
          ./scripts/resolve-note.sh migration | head -5

      - name: Check version sync across packages
        run: ./scripts/bump-version.sh --check

      - name: Check translation parity (multilingual SKILL)
        run: ./scripts/check-translation-parity.sh --strict

      - name: Check eval gold-set integrity (strict, API-free)
        run: ./scripts/check-eval-goldset.sh --strict

      - name: Check generated asset and documentation statistics
        run: |
          node scripts/generate-asset-manifest.mjs --check
          node scripts/check-doc-stats.mjs

      # 릴리스를 막는 게이트 로직 자체의 회귀 방지. 파일은 있었으나
      # 어느 워크플로에서도 실행되지 않고 있었다.
      - name: Test eval quality gate logic
        run: node --test scripts/eval/check-gate.test.mjs

  runtime-contract:
    name: Runtime & MCP (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install runtime dependencies
        working-directory: packages/runtime
        run: npm ci --workspaces=false
      - name: Install MCP dependencies
        working-directory: mcp
        run: npm ci --workspaces=false
      - name: Build shared runtime and MCP
        run: npm run build
      - name: Run unit and real MCP client contract tests
        run: npm test

  mcp-clean-install:
    name: MCP npm pack & clean install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # mcp/tsconfig.json 이 ../packages/runtime/src 를 함께 컴파일한다.
      # runtime 소스의 import 는 packages/runtime/node_modules 에서 해석되므로
      # 여기를 설치하지 않으면 prepack 의 tsc 가 js-yaml/ajv 를 못 찾는다.
      - name: Install runtime dependencies
        working-directory: packages/runtime
        run: npm ci --workspaces=false
      - working-directory: mcp
        run: npm ci --workspaces=false
      - working-directory: mcp
        run: npm run test:pack --workspaces=false

  extension-compile:
    name: VS Code Extension compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # 루트에 package-lock.json 이 없어서, 워크스페이스 루트로 올라가면
      # extension/package-lock.json 을 두고도 lockfile 을 못 찾는다.
      - working-directory: extension
        run: npm ci --workspaces=false
      - working-directory: extension
        run: npm run compile

  desktop-typecheck:
    name: sapstack Desktop typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # electron 의 tsc 는 packages/runtime/src 까지 들어간다. runtime 소스의
      # import 는 packages/runtime/node_modules 에서 해석되므로 함께 설치한다.
      - name: Install runtime dependencies
        working-directory: packages/runtime
        run: npm ci --workspaces=false
      - working-directory: apps/desktop
        run: bun install --frozen-lockfile --ignore-scripts
      # --ignore-scripts 는 electron 의 postinstall(바이너리 다운로드)까지 건너뛴다.
      # 그러면 `electron-log/main` 이 로드 시점에 electron 을 require 하다
      # "Electron failed to install correctly" 로 죽고, 그 모듈을 import 하는
      # 테스트 파일이 통째로 실패한다. 테스트는 Electron 을 실행하지 않고
      # 경로만 필요로 하므로 postinstall 만 따로 돌린다.
      - name: Install Electron binary (postinstall skipped above)
        working-directory: apps/desktop
        run: node node_modules/electron/install.js
      - working-directory: apps/desktop
        run: bun run typecheck:shared
      - working-directory: apps/desktop
        run: bun run typecheck:electron

      # 관찰 모드(continue-on-error)로 확보한 판정: ubuntu 실패 32건은
      # 브라우저 자동화 스위트(feature flag 로 기본 off, 스위트도 함께 skip)와
      # 환경 의존이던 refreshConnectionRuntime 테스트(hermetic 픽스처로 고정)
      # 였다. 둘 다 처리됐으므로 정식 게이트로 승격한다. Windows 전용 실패
      # 39건은 ubuntu 러너와 무관하다.
      - name: Run desktop tests
        working-directory: apps/desktop
        run: bun test
